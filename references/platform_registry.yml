# Capability levels:
# 0 manual JD only
# 1 public search/detail extraction
# 2 user-authorized read-only logged-in browsing
# 3 assisted packet/open-page/prefill, user submits
# 4 controlled auto-apply, explicit confirmation per action

platforms:
  - id: boss
    name: BOSS直聘
    domains: ["zhipin.com"]
    priority: P0
    category: mainstream
    capability_level: 3
    supports: ["search", "detail_parse", "greeting_draft", "manual_handoff"]
    requires_login_for: ["chat", "apply", "full_recruiter_info"]
    default_mode: semi_auto
    risk: high
    notes: "可参考 boss-agent-cli；真实沟通和投递必须确认。"

  - id: zhilian
    name: 智联招聘
    domains: ["zhaopin.com"]
    priority: P0
    category: mainstream
    capability_level: 3
    supports: ["search", "detail_parse", "resume_packet", "manual_handoff"]
    requires_login_for: ["apply", "resume_upload"]
    default_mode: semi_auto
    risk: high
    notes: "真实投递和上传附件必须确认。"

  - id: qiancheng
    name: 前程无忧
    domains: ["51job.com"]
    priority: P0

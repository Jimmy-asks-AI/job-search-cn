# Capability levels:
# 0 manual JD only
# 1 public search/detail extraction
# 2 user-authorized read-only logged-in browsing
# 3 assisted packet/open-page/prefill, user submits
# 4 controlled auto-apply, explicit confirmation per action
#
# Risk-control fields:
# session_lifetime_hint: how stable logged-in sessions usually are for planning.
# rate_limit_hint: conservative pacing guidance; never bypass platform limits.
# ui_challenge_observed: likely UI/security challenges to stop on.
# fallback_mode_when_blocked: required mode when automation is blocked.

platforms:
  - id: boss
    name: BOSS直聘
    domains: ["zhipin.com"]
    priority: P0
    category: mainstream
    capability_level: 3
    supports: ["search", "detail_parse", "greeting_draft", "manual_handoff"]
    requires_login_for: ["chat", "apply", "full_recruiter_info"]
    default_mode: semi_auto
    risk: high
    session_lifetime_hint: "short_or_unstable"
    rate_limit_hint: "strict; one confirmed greeting or application at a time"
    ui_challenge_observed: ["captcha", "risk_prompt", "login_refresh", "chat_limit"]
    fallback_mode_when_blocked: manual_handoff
    notes: "可参考 boss-agent-cli；真实沟通和投递必须确认。"


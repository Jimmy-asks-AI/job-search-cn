    capability_level: 3
    supports: ["search", "detail_parse", "resume_packet", "manual_handoff"]
    requires_login_for: ["apply", "resume_upload"]
    default_mode: semi_auto
    risk: high
    notes: "也称 51job；可参考 boss-agent-cli 和 job-crawler。"

  - id: liepin
